<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VC Wrapped: Missed Calls</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4b2bee",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulse-glow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        'pulse-glow': {
                            '0%, 100%': { opacity: '0.6', transform: 'scale(1)' },
                            '50%': { opacity: '1', transform: 'scale(1.1)' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark h-screen w-full overflow-hidden flex flex-col font-display antialiased selection:bg-primary selection:text-white relative group/design-root">
<!-- Ambient Background Effects -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-primary/20 blur-[120px] rounded-full mix-blend-screen opacity-60 animate-pulse-glow"></div>
<div class="absolute bottom-0 right-0 w-[300px] h-[300px] bg-indigo-900/20 blur-[80px] rounded-full mix-blend-screen"></div>
</div>
<!-- UI Container -->
<div class="relative z-10 flex flex-col h-full w-full max-w-md mx-auto">
<!-- Story Progress Bars -->
<div class="flex w-full flex-row items-center justify-center gap-2 px-4 py-6">
<div class="h-1.5 flex-1 rounded-full bg-white/20 overflow-hidden">
<div class="h-full w-full bg-white rounded-full"></div>
</div>
<div class="h-1.5 flex-1 rounded-full bg-white/20 overflow-hidden">
<div class="h-full w-full bg-white rounded-full"></div>
</div>
<div class="h-1.5 flex-1 rounded-full bg-white/20 overflow-hidden">
<div class="h-full w-full bg-white rounded-full"></div>
</div>
<div class="h-1.5 flex-1 rounded-full bg-white/20 overflow-hidden">
<div class="h-full w-2/3 bg-white rounded-full"></div>
</div>
<div class="h-1.5 flex-1 rounded-full bg-white/20"></div>
</div>
<!-- ToolBar -->
<div class="flex justify-between items-center px-6">
<div class="flex items-center gap-2 text-white/70">
<span class="material-symbols-outlined text-[20px] text-primary">graphic_eq</span>
<span class="text-xs font-bold tracking-widest uppercase opacity-80">VC Wrapped</span>
</div>
<button class="p-2 rounded-full hover:bg-white/10 transition-colors text-white">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center text-center px-6 -mt-10">
<!-- Headline -->
<h3 class="text-white/90 tracking-wide text-xl font-medium leading-tight mb-8">
                The ones that got away
            </h3>
<!-- Central Hero Graphic -->
<div class="relative mb-10 animate-float">
<!-- Outer Rings -->
<div class="absolute inset-0 -m-8 border border-white/5 rounded-full"></div>
<div class="absolute inset-0 -m-4 border border-white/10 rounded-full"></div>
<!-- Main Icon Circle -->
<div class="w-32 h-32 rounded-full glass-panel flex flex-col items-center justify-center shadow-[0_0_50px_-10px_rgba(75,43,238,0.3)] group cursor-pointer transition-transform hover:scale-105">
<span class="material-symbols-outlined text-primary text-[48px] group-hover:text-white transition-colors">phone_missed</span>
<div class="h-1.5 w-1.5 bg-red-400 rounded-full absolute top-8 right-8 animate-ping"></div>
</div>
</div>
<!-- Big Stat Number -->
<div class="relative mb-2">
<h1 class="text-white tracking-tighter text-[100px] leading-none font-bold drop-shadow-2xl">
                    23
                </h1>
</div>
<!-- Descriptor & Subtext -->
<div class="space-y-4 max-w-[280px]">
<p class="text-primary font-bold text-lg uppercase tracking-widest">Missed Calls</p>
<p class="text-white/60 text-sm font-light leading-relaxed">
                    Most were busy moments. <br/>
                    A few… you wish you picked up.
                </p>
</div>
</main>
<!-- Footer / Action Area -->
<div class="px-6 pb-10 w-full flex flex-col items-center gap-4">
<button class="w-full h-14 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/10 flex items-center justify-center gap-3 transition-all active:scale-95 group">
<span class="material-symbols-outlined text-white text-[20px] group-hover:rotate-12 transition-transform">ios_share</span>
<span class="text-white font-semibold text-sm tracking-wide">Share this stat</span>
</button>
<div class="h-1 w-1/3 bg-white/20 rounded-full mt-2"></div>
</div>
</div>
</body></html>
