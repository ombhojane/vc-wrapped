<div class="w-full glass-panel rounded-[2rem] p-6 flex flex-col items-center relative overflow-hidden group">

<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-primary/10 to-transparent opacity-50 pointer-events-none"></div>

<div class="relative w-48 h-48 rounded-full border-4 border-white/10 flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(75,43,238,0.2)]">

<div class="absolute w-full h-full rounded-full border border-white/5"></div>
<div class="absolute w-1 h-3 bg-white/30 top-2 rounded-full"></div>
<div class="absolute w-1 h-3 bg-white/30 bottom-2 rounded-full"></div>
<div class="absolute w-3 h-1 bg-white/30 left-2 rounded-full"></div>
<div class="absolute w-3 h-1 bg-white/30 right-2 rounded-full"></div>

<div class="w-4 h-4 bg-primary rounded-full z-10 shadow-[0_0_10px_#4b2bee]"></div>

<div class="absolute w-1.5 h-12 bg-white rounded-full origin-bottom bottom-1/2 left-[calc(50%-3px)] -rotate-[20deg] shadow-lg"></div>
<!-- Minute Hand (Pointing roughly to 47) -->
<div class="absolute w-1 h-16 bg-primary rounded-full origin-bottom bottom-1/2 left-[calc(50%-2px)] -rotate-[80deg] shadow-[0_0_10px_rgba(75,43,238,0.8)]"></div>

<p class="text-white/70 text-base font-medium leading-normal max-w-[200px] mx-auto">You did your best talking late at night.</p>
</div>
</div>
<!-- Card 2: Busiest Day -->
<div class="w-full flex flex-col gap-4">
<div class="text-left px-2">
<p class="text-white/50 text-sm font-medium uppercase tracking-widest">Weekly Rhythm</p>
</div>
<div class="glass-panel rounded-[2rem] p-6 w-full">

                                42 calls
                            </div>
</div>
<!-- Friday -->
<div class="w-full bg-white/10 rounded-t-full h-[70%] relative group"></div>
<!-- Saturday -->
<div class="w-full bg-white/10 rounded-t-full h-[85%] relative group"></div>
<!-- Sunday -->

<div class="h-10 w-10 rounded-full bg-primary/20 flex items-center justify-center text-primary">

</div>
</div>
</div>
